name: Validate LabStatus

# Production publishing is managed by ChatGPT Sites for the existing site.
# Do not export, migrate, or deploy the live patient database from this workflow.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: labstatus-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test notification handling and access controls
        run: npm test
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Build production site
        run: npm run build
